name: Build LightShelf

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: ./gradlew :extension:assembleDebug :extension:assembleRelease :extension:testDebugUnitTest :extension:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LightShelf-apks
          path: extension/build/outputs/apk/**/*.apk
          if-no-files-found: error
